<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pfarrwerfner Minis</title>

  <link rel="stylesheet" href="style.css">

  <!-- ✅ PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2f5d50">

  <!-- ✅ iOS Support -->
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

  <!-- HERO -->
  <div class="card hero-card">
    <h1>🕊 Pfarrwerfner Minis</h1>
    <div class="subtitle">Zusammen stark im Glauben</div>
    <div class="hero-highlight">Hey, du! Ja, genau DU!</div>
  </div>

  <!-- TOP BAR -->
  <div class="top-bar">
    <button id="darkToggle">🌙 Dark Mode</button>
    <button id="btnInstall" style="display:none;">📲 App installieren</button>
    <button id="btnLogout" class="secondary" style="display:none;">Logout</button>
  </div>

  <!-- REMINDER -->
  <div id="reminderBox">
    <span class="reminder-icon">⛪</span>
    <span class="reminder-text">Nicht vergessen: Du ministrierst morgen!</span>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="card login-card">
    <div id="loginStatus">Nicht eingeloggt</div>

    <div id="loginForm">
      <input id="email" type="email" placeholder="E-Mail">
      <input id="password" type="password" placeholder="Passwort">
      <button id="btnLogin">Login</button>
    </div>

    <div id="kindContainer" style="display:none;">
      <label class="label" for="kind">Ministrant auswählen:</label>
      <select id="kind">
        <option value="">🕯️ Mini auswählen…</option>
      </select>
    </div>
  </div>

  <!-- LISTE -->
  <div id="liste"></div>

  <!-- Firebase -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-app-compat.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-auth-compat.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.3.0/firebase-firestore-compat.min.js"></script>

  <script src="script.js"></script>

  <!-- ✅ Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
